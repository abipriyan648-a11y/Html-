
<!DOCTYPE html>
<html>
<head>
    <title>Student E-Commerce</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }
        header {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background: black;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 25px;
        }
        .product {
            background: white;
            width: 200px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }
        .product img {
            width: 150px;
            height: 130px;
            object-fit: contain;
        }
        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>Student Shopping Website</h1>
    <p>Welcome to Our E-Commerce Store</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>
</nav>

<h2 id="home" style="text-align:center">
    Welcome Students!
</h2>

<h2 id="products" style="text-align:center">
    Our Products
</h2>

<div class="container">

    <div class="product">
        <img src="https://placehold.co/150x130?text=Book">
        <h3>Books</h3>
        <p>Price: ₹200</p>
        <button onclick="addCart('Books',200)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <img src="https://placehold.co/150x130?text=Bag">
        <h3>School Bag</h3>
        <p>Price: ₹500</p>
        <button onclick="addCart('School Bag',500)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <img src="https://placehold.co/150x130?text=Pen">
        <h3>Pen</h3>
        <p>Price: ₹20</p>
        <button onclick="addCart('Pen',20)">
            Add to Cart
        </button>
    </div>

</div>

<h2 id="cart" style="text-align:center">
    Shopping Cart
</h2>

<div id="cartItems" style="text-align:center">
    Your cart is empty
</div>

<h3 id="total" style="text-align:center">
    Total: ₹0
</h3>

<footer>
    <p>© 2026 Student E-Commerce Website</p>
</footer>

<script>
let total = 0;

function addCart(name, price) {
    let cart = document.getElementById("cartItems");

    if (cart.innerHTML === "Your cart is empty") {
        cart.innerHTML = "";
    }

    cart.innerHTML += "<p>" + name + " - ₹" + price + "</p>";

    total += price;

    document.getElementById("total").innerHTML =
        "Total: ₹" + total;
}
</script>

</body>
</html>
